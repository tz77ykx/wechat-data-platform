{% extends "base.html" %}
{% block title %}发文日历 — 公众号管理平台{% endblock %}

{% block head %}
<style>
    /* 日历专用样式 */
    .cal-nav {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
    }
    .cal-nav .cal-label {
        font-family: var(--font-title);
        font-size: 17px;
        font-weight: 600;
        min-width: 120px;
        text-align: center;
    }
    .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 1px;
        background: var(--border-light);
        border: 1px solid var(--border);
    }
    .cal-header-cell {
        background: var(--bg);
        padding: 8px 4px;
        text-align: center;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
    }
    .cal-cell {
        background: var(--surface);
        min-height: 90px;
        padding: 6px;
        position: relative;
        vertical-align: top;
    }
    .cal-cell.empty {
        background: var(--bg);
    }
    .cal-day-num {
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }
    .cal-cell.today .cal-day-num {
        color: var(--surface);
        background: var(--accent);
        display: inline-block;
        width: 22px;
        height: 22px;
        line-height: 22px;
        text-align: center;
        border-radius: 50%;
    }
    .cal-chip {
        display: block;
        font-size: 11px;
        padding: 2px 6px;
        margin-bottom: 2px;
        background: var(--accent-light);
        border-left: 3px solid var(--accent);
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.15s;
    }
    .cal-chip:hover {
        background: rgba(7, 193, 96, 0.16);
    }

    /* 规划列表 */
    .plan-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border-light);
    }
    .plan-item:last-child { border-bottom: none; }
    .plan-date {
        font-size: 13px;
        color: var(--text-secondary);
        min-width: 90px;
        font-variant-numeric: tabular-nums;
    }
    .plan-topic {
        flex: 1;
        font-size: 14px;
        color: var(--text);
    }
    .plan-note {
        font-size: 12px;
        color: var(--text-muted);
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .plan-status {
        font-size: 11px;
        padding: 2px 8px;
        border: 1px solid var(--border);
    }
    .plan-status.planned  { background: #FFF3CD; border-color: var(--warning); color: #856404; }
    .plan-status.writing  { background: #D1ECF1; border-color: #17A2B8; color: #0C5460; }
    .plan-status.done     { background: #D4EDDA; border-color: #28A745; color: #155724; }
    .plan-actions {
        display: flex;
        gap: 6px;
    }

    /* 热力图增强 */
    .heatmap-months {
        display: flex;
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 4px;
        padding-left: 32px;
    }
    .heatmap-months span {
        flex: 1;
    }
    .heatmap-row {
        display: flex;
        align-items: center;
        gap: 2px;
    }
    .heatmap-row-label {
        width: 28px;
        font-size: 10px;
        color: var(--text-muted);
        text-align: right;
        padding-right: 4px;
    }
    .heatmap-cell[title] {
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2 class="page-title">发文日历</h2>
        <div class="page-subtitle">发文热度、月历总览与内容规划</div>
    </div>
</div>

<!-- 阅读量热力图 -->
<div class="card">
    <div class="card-title">阅读量热力图</div>
    <div class="heatmap-container">
        <div id="heatmapMonths" class="heatmap-months"></div>
        <div id="heatmapGrid"></div>
    </div>
    <div class="heatmap-legend">
        <span>少</span>
        <div class="heatmap-cell level-0"></div>
        <div class="heatmap-cell level-1"></div>
        <div class="heatmap-cell level-2"></div>
        <div class="heatmap-cell level-3"></div>
        <div class="heatmap-cell level-4"></div>
        <span>多</span>
    </div>
</div>

<!-- 月历 -->
<div class="card">
    <div class="card-title">发文月历</div>
    <div class="cal-nav">
        <button class="btn btn-outline" id="btnPrevMonth">&larr; 上月</button>
        <div class="cal-label" id="calLabel"></div>
        <button class="btn btn-outline" id="btnNextMonth">下月 &rarr;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
</div>

<!-- 文章详情弹窗 -->
<div class="modal-overlay" id="articleModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">文章详情</div>
            <button class="modal-close" onclick="document.getElementById('articleModal').classList.remove('active')">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<!-- 发文规划 -->
<div class="card">
    <div class="card-title">发文规划</div>

    <!-- 新增规划表单 -->
    <div style="margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border-light);">
        <div class="form-row" style="grid-template-columns: 140px 1fr 1fr 120px auto; align-items:end;">
            <div class="form-group" style="margin-bottom:0;">
                <label>日期</label>
                <input type="date" class="form-input" id="planDate">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>主题</label>
                <input type="text" class="form-input" id="planTopic" placeholder="文章主题">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>备注</label>
                <input type="text" class="form-input" id="planNote" placeholder="备注（可选）">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>状态</label>
                <select class="form-select" id="planStatus">
                    <option value="planned">计划中</option>
                    <option value="writing">撰写中</option>
                    <option value="done">已完成</option>
                </select>
            </div>
            <div style="padding-bottom:0;">
                <button class="btn btn-primary" id="btnAddPlan">添加</button>
            </div>
        </div>
    </div>

    <!-- 规划列表 -->
    <div id="planList">
        <div class="loading">加载中...</div>
    </div>
</div>

<!-- 编辑规划弹窗 -->
<div class="modal-overlay" id="editPlanModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">编辑规划</div>
            <button class="modal-close" onclick="document.getElementById('editPlanModal').classList.remove('active')">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editPlanId">
            <div class="form-group">
                <label>日期</label>
                <input type="date" class="form-input" id="editPlanDate">
            </div>
            <div class="form-group">
                <label>主题</label>
                <input type="text" class="form-input" id="editPlanTopic">
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" class="form-input" id="editPlanNote">
            </div>
            <div class="form-group">
                <label>状态</label>
                <select class="form-select" id="editPlanStatus">
                    <option value="planned">计划中</option>
                    <option value="writing">撰写中</option>
                    <option value="done">已完成</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="document.getElementById('editPlanModal').classList.remove('active')">取消</button>
                <button class="btn btn-primary" id="btnSaveEdit">保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    /* ── 热力图 ────────────────────────────────────────────────────────────── */
    async function loadHeatmap() {
        const res = await fetch('/api/heatmap');
        const data = await res.json();
        // data: [{ date, reads, level }, ...]
        // Build a map for quick lookup
        const map = {};
        data.forEach(d => { map[d.date] = d; });

        const grid = document.getElementById('heatmapGrid');
        const monthsRow = document.getElementById('heatmapMonths');
        grid.innerHTML = '';
        monthsRow.innerHTML = '';

        // Build 53 weeks x 7 days, ending today
        const today = new Date();
        const dayOfWeek = today.getDay(); // 0=Sun
        // End of grid = this Saturday (or today if Saturday)
        const endDate = new Date(today);
        endDate.setDate(endDate.getDate() + (6 - dayOfWeek));
        const startDate = new Date(endDate);
        startDate.setDate(startDate.getDate() - (53 * 7 - 1));

        const dayLabels = ['日', '一', '二', '三', '四', '五', '六'];

        // Render rows (one per day-of-week)
        for (let dow = 0; dow < 7; dow++) {
            const row = document.createElement('div');
            row.className = 'heatmap-row';

            const label = document.createElement('div');
            label.className = 'heatmap-row-label';
            label.textContent = (dow % 2 === 1) ? dayLabels[dow] : '';
            row.appendChild(label);

            for (let w = 0; w < 53; w++) {
                const cellDate = new Date(startDate);
                cellDate.setDate(cellDate.getDate() + w * 7 + dow);
                const dateStr = cellDate.toISOString().slice(0, 10);

                const cell = document.createElement('div');
                cell.className = 'heatmap-cell';
                const info = map[dateStr];
                if (info) {
                    cell.classList.add('level-' + info.level);
                    cell.title = dateStr + ': ' + (info.reads || 0).toLocaleString() + ' 阅读';
                } else {
                    cell.classList.add('level-0');
                    cell.title = dateStr;
                }
                if (cellDate > today) {
                    cell.style.visibility = 'hidden';
                }
                row.appendChild(cell);
            }
            grid.appendChild(row);
        }

        // Month labels
        let lastMonth = -1;
        for (let w = 0; w < 53; w++) {
            const d = new Date(startDate);
            d.setDate(d.getDate() + w * 7);
            const m = d.getMonth();
            if (m !== lastMonth) {
                const span = document.createElement('span');
                span.textContent = (m + 1) + '月';
                span.style.marginLeft = (w * 16) + 'px';
                span.style.position = 'absolute';
                monthsRow.appendChild(span);
                lastMonth = m;
            }
        }
        monthsRow.style.position = 'relative';
        monthsRow.style.height = '16px';
    }

    /* ── 月历 ──────────────────────────────────────────────────────────────── */
    let calYear, calMonth;
    let calData = {};

    function initCalNav() {
        const now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth(); // 0-based
        document.getElementById('btnPrevMonth').addEventListener('click', () => {
            calMonth--;
            if (calMonth < 0) { calMonth = 11; calYear--; }
            loadCalendar();
        });
        document.getElementById('btnNextMonth').addEventListener('click', () => {
            calMonth++;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            loadCalendar();
        });
    }

    async function loadCalendar() {
        const label = document.getElementById('calLabel');
        label.textContent = calYear + '年' + (calMonth + 1) + '月';

        const res = await fetch('/api/calendar');
        const data = await res.json();
        // data: [{ publish_date, title, total_reads }, ...] — flat list, group by date
        calData = {};
        data.forEach(d => {
            const key = d.publish_date;
            if (!key) return;
            if (!calData[key]) calData[key] = [];
            calData[key].push({
                title: d.title,
                reads: d.total_reads,
                date: d.publish_date
            });
        });

        renderCalGrid();
    }

    function renderCalGrid() {
        const grid = document.getElementById('calGrid');
        grid.innerHTML = '';

        // Header row
        const dayNames = ['一', '二', '三', '四', '五', '六', '日'];
        dayNames.forEach(name => {
            const cell = document.createElement('div');
            cell.className = 'cal-header-cell';
            cell.textContent = name;
            grid.appendChild(cell);
        });

        // First day of month
        const firstDay = new Date(calYear, calMonth, 1);
        let startDow = firstDay.getDay(); // 0=Sun
        // Convert to Mon=0 format
        startDow = startDow === 0 ? 6 : startDow - 1;

        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const today = new Date();
        const todayStr = today.toISOString().slice(0, 10);

        // Empty cells before first day
        for (let i = 0; i < startDow; i++) {
            const cell = document.createElement('div');
            cell.className = 'cal-cell empty';
            grid.appendChild(cell);
        }

        // Day cells
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            const cell = document.createElement('div');
            cell.className = 'cal-cell';
            if (dateStr === todayStr) cell.classList.add('today');

            const numEl = document.createElement('div');
            numEl.className = 'cal-day-num';
            numEl.textContent = d;
            cell.appendChild(numEl);

            const articles = calData[dateStr] || [];
            articles.forEach(art => {
                const chip = document.createElement('div');
                chip.className = 'cal-chip';
                chip.textContent = art.title;
                chip.title = art.title;
                chip.addEventListener('click', () => showArticleModal(art));
                cell.appendChild(chip);
            });

            grid.appendChild(cell);
        }

        // Trailing empty cells
        const totalCells = startDow + daysInMonth;
        const remainder = totalCells % 7;
        if (remainder > 0) {
            for (let i = 0; i < 7 - remainder; i++) {
                const cell = document.createElement('div');
                cell.className = 'cal-cell empty';
                grid.appendChild(cell);
            }
        }
    }

    function showArticleModal(art) {
        document.getElementById('modalTitle').textContent = art.title || '文章详情';
        const body = document.getElementById('modalBody');
        body.innerHTML = '';

        const fields = [
            { label: '标题', value: art.title },
            { label: '日期', value: art.date || art.pub_date },
            { label: '阅读量', value: art.reads != null ? art.reads.toLocaleString() : '-' },
            { label: '分享', value: art.shares != null ? art.shares.toLocaleString() : '-' },
            { label: '点赞', value: art.likes != null ? art.likes.toLocaleString() : '-' },
            { label: '收藏', value: art.favs != null ? art.favs.toLocaleString() : '-' },
        ];
        fields.forEach(f => {
            if (!f.value) return;
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px;';
            row.innerHTML = '<span style="color:var(--text-secondary)">' + f.label + '</span><span>' + f.value + '</span>';
            body.appendChild(row);
        });

        if (art.url) {
            const link = document.createElement('a');
            link.href = art.url;
            link.target = '_blank';
            link.className = 'btn btn-outline mt-16';
            link.textContent = '阅读原文';
            link.style.display = 'inline-block';
            body.appendChild(link);
        }

        document.getElementById('articleModal').classList.add('active');
    }

    /* ── 发文规划 CRUD ─────────────────────────────────────────────────────── */
    const statusLabels = { planned: '计划中', writing: '撰写中', done: '已完成' };

    async function loadPlans() {
        const container = document.getElementById('planList');
        container.innerHTML = '<div class="loading">加载中...</div>';
        const res = await fetch('/api/plans');
        const plans = await res.json();

        if (!plans.length) {
            container.innerHTML = '<div class="empty-state">暂无发文规划，点击上方"添加"创建</div>';
            return;
        }

        container.innerHTML = '';
        plans.forEach(plan => {
            const item = document.createElement('div');
            item.className = 'plan-item';
            item.innerHTML =
                '<div class="plan-date">' + plan.date + '</div>' +
                '<div class="plan-topic">' + escapeHtml(plan.topic) + '</div>' +
                '<div class="plan-note">' + escapeHtml(plan.note || '') + '</div>' +
                '<div class="plan-status ' + plan.status + '">' + (statusLabels[plan.status] || plan.status) + '</div>' +
                '<div class="plan-actions">' +
                    '<button class="btn-text" data-edit="' + plan.id + '">编辑</button>' +
                    '<button class="btn-danger" data-delete="' + plan.id + '">删除</button>' +
                '</div>';
            container.appendChild(item);
        });

        // Bind edit buttons
        container.querySelectorAll('[data-edit]').forEach(btn => {
            btn.addEventListener('click', () => openEditModal(plans.find(p => p.id == btn.dataset.edit)));
        });

        // Bind delete buttons
        container.querySelectorAll('[data-delete]').forEach(btn => {
            btn.addEventListener('click', () => deletePlan(btn.dataset.delete));
        });
    }

    async function addPlan() {
        const date = document.getElementById('planDate').value;
        const topic = document.getElementById('planTopic').value.trim();
        const note = document.getElementById('planNote').value.trim();
        const status = document.getElementById('planStatus').value;

        if (!date || !topic) {
            alert('请填写日期和主题');
            return;
        }

        await fetch('/api/plans', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date, topic, note, status }),
        });

        // Clear form
        document.getElementById('planDate').value = '';
        document.getElementById('planTopic').value = '';
        document.getElementById('planNote').value = '';
        document.getElementById('planStatus').value = 'planned';

        loadPlans();
    }

    function openEditModal(plan) {
        if (!plan) return;
        document.getElementById('editPlanId').value = plan.id;
        document.getElementById('editPlanDate').value = plan.date;
        document.getElementById('editPlanTopic').value = plan.topic;
        document.getElementById('editPlanNote').value = plan.note || '';
        document.getElementById('editPlanStatus').value = plan.status;
        document.getElementById('editPlanModal').classList.add('active');
    }

    async function saveEdit() {
        const id = document.getElementById('editPlanId').value;
        const date = document.getElementById('editPlanDate').value;
        const topic = document.getElementById('editPlanTopic').value.trim();
        const note = document.getElementById('editPlanNote').value.trim();
        const status = document.getElementById('editPlanStatus').value;

        if (!date || !topic) {
            alert('请填写日期和主题');
            return;
        }

        await fetch('/api/plans/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date, topic, note, status }),
        });

        document.getElementById('editPlanModal').classList.remove('active');
        loadPlans();
    }

    async function deletePlan(id) {
        if (!confirm('确定删除此规划？')) return;
        await fetch('/api/plans/' + id, { method: 'DELETE' });
        loadPlans();
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    /* ── 初始化 ────────────────────────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', () => {
        loadHeatmap();
        initCalNav();
        loadCalendar();
        loadPlans();

        document.getElementById('btnAddPlan').addEventListener('click', addPlan);
        document.getElementById('btnSaveEdit').addEventListener('click', saveEdit);
    });
})();
</script>
{% endblock %}
